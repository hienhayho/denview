<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DenView Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #fafaf9; color: #1a1815; min-height: 100vh; display: flex; flex-direction: column; }

    .header { padding: 20px 32px; border-bottom: 1px solid #e8e6df; background: #fff; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .header p { font-size: 13px; color: #807a6f; }

    .config { display: flex; align-items: flex-end; gap: 12px; padding: 16px 32px; border-bottom: 1px solid #e8e6df; background: #fff; flex-shrink: 0; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 160px; }
    label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #807a6f; }
    input { padding: 9px 12px; border: 1px solid #e8e6df; border-radius: 8px; font-size: 13px; background: #fafaf9; color: #1a1815; outline: none; font-family: inherit; }
    input:focus { border-color: #a09890; }

    button { padding: 10px 20px; border: none; border-radius: 8px; background: #14110d; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; flex-shrink: 0; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .status { font-size: 12px; color: #807a6f; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #d0ccc4; flex-shrink: 0; }
    .dot.running { background: #22c55e; animation: pulse 1.5s ease-in-out infinite; }
    .dot.done { background: #807a6f; }
    .dot.error { background: #ef4444; }

    .preview { flex: 1; display: flex; flex-direction: column; }
    .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #b0aaa0; font-size: 13px; }
    iframe { flex: 1; border: none; width: 100%; display: none; }

    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
  </style>
</head>
<body>

<div class="header">
  <h1>DenView</h1>
  <p>multi-agent office demo</p>
</div>

<div class="config">
  <div class="field">
    <label>Backend URL</label>
    <input id="backendUrl" value="http://localhost:8000"/>
  </div>
  <div class="field">
    <label>Frontend URL</label>
    <input id="frontendUrl" value="http://localhost:3000"/>
  </div>
  <div class="field" style="max-width:260px">
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="your-api-key"/>
  </div>
  <button id="runBtn" onclick="runDemo()">Start Demo</button>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Idle</span>
  </div>
</div>

<div class="preview">
  <div class="empty" id="empty">Enter your config and click Start Demo.</div>
  <iframe id="frame"></iframe>
</div>

<script>
function setStatus(state, text) {
  const dot = document.getElementById('dot')
  dot.className = 'dot' + (state ? ' ' + state : '')
  document.getElementById('statusText').textContent = text
}

async function runDemo() {
  const backendUrl = document.getElementById('backendUrl').value.replace(/\/$/, '')
  const frontendUrl = document.getElementById('frontendUrl').value.replace(/\/$/, '')
  const apiKey = document.getElementById('apiKey').value.trim()

  if (!apiKey) { alert('Enter an API key.'); return }

  const btn = document.getElementById('runBtn')
  btn.disabled = true
  setStatus('running', 'Starting…')

  try {
    const res = await fetch(`${backendUrl}/demo/run`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
      body: JSON.stringify({ backend_url: backendUrl, frontend_url: frontendUrl }),
    })
    if (!res.ok) {
      const err = await res.json().catch(() => ({}))
      throw new Error(err.detail ?? `Error ${res.status}`)
    }
    const { task_id, view_token, embed_url } = await res.json()

    const embedUrl = embed_url
    document.getElementById('empty').style.display = 'none'
    const frame = document.getElementById('frame')
    frame.src = embedUrl
    frame.style.display = 'block'
    setStatus('running', `Task #${task_id} running`)

    // poll until done
    const poll = setInterval(async () => {
      try {
        const s = await fetch(`${backendUrl}/tasks/${task_id}/state?token=${encodeURIComponent(view_token)}`)
        const data = await s.json()
        if (data.task_status === 'done' || data.task_status === 'failed') {
          clearInterval(poll)
          setStatus('done', `Task #${task_id} ${data.task_status}`)
          btn.disabled = false
        }
      } catch {}
    }, 3000)

  } catch (err) {
    setStatus('error', err.message)
    btn.disabled = false
  }
}
</script>
</body>
</html>
