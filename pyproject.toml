[project]
name = "denview"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.136.3",
    "fire>=0.7.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "sqlmodel>=0.0.38",
    "structlog>=26.1.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
denview = "denview.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["denview"]

[tool.hatch.build]
exclude = [
    "ui/",
    ".claude/",
    "dist/",
    "*.db",
    "denview/**/__pycache__",
    "denview/**/*.pyc",
]
